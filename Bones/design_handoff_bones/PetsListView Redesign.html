<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bones · Rediseño PetsListView</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; font-family: 'Inter', system-ui, sans-serif; }
    #root { height: 100%; }
    button { font-family: inherit; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="variant-b.jsx"></script>
  <script type="text/babel" src="pet-detail-b.jsx"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    // Each artboard is an iPhone frame with a variant screen.
    // Frame size matches IOSDevice defaults (402x874).
    const FRAME_W = 402;
    const FRAME_H = 874;

    function PhoneFrame({ children }) {
      const Device = window.IOSDevice;
      return <Device width={FRAME_W} height={FRAME_H}>{children}</Device>;
    }

    function App() {
      const VB = window.VariantB;
      const PD = window.PetDetailB;
      const pets3 = window.petsFor(3);
      const pets6 = window.petsFor(6);
      const pet1 = window.petsFor(1)[0];

      return (
        <DesignCanvas>
          {/* ── INTRO ──────────────────────────────────── */}
          <DCSection
            id="intro"
            title="Bones · Rediseño de PetsListView"
            subtitle="Dirección elegida: Vet Pro. Dashboard moderno con estado actual + próximo evento por categoría. Color por mascota como identidad sutil. Grilla unificada para 2+ (1 mascota = dashboard)."
          >
            <DCPostIt color="#d4e9f7">
              <strong>Vet Pro · sistema</strong><br/>
              Dashboard moderno. Inter geométrico, números en JetBrains Mono, cards blancos con sombras micro, pills de estado y mini-timelines. Color = chip monograma saturado.
            </DCPostIt>
            <DCPostIt color="#e8e3d8">
              <strong>Decisiones compartidas</strong><br/>
              · 1 mascota → dashboard a pantalla completa<br/>
              · 2+ mascotas → grilla unificada (escala con cantidad)<br/>
              · Estado de salud sutil: punto verde / ámbar / rojo<br/>
              · Acciones rápidas ocultas (swipe izquierda)<br/>
              · Iconografía custom (jeringa, gota, balanza, paw)
            </DCPostIt>
          </DCSection>

          {/* ── STATE 1: EMPTY ─────────────────────────── */}
          <DCSection
            id="empty"
            title="01 · Estado vacío"
            subtitle="Sin mascotas — el primer momento. La invitación a crear el primer expediente."
          >
            <DCArtboard id="b-empty" label="Vet Pro" width={FRAME_W} height={FRAME_H}>
              <PhoneFrame><VB.EmptyState /></PhoneFrame>
            </DCArtboard>
          </DCSection>

          {/* ── STATE 2: ONE PET DASHBOARD ─────────────── */}
          <DCSection
            id="one"
            title="02 · 1 mascota — Dashboard"
            subtitle="Cuando solo hay una mascota, la lista se convierte en un resumen completo. Foto, estado, próximos cuidados y registros recientes."
          >
            <DCArtboard id="b-one" label="Vet Pro · Marcos" width={FRAME_W} height={FRAME_H}>
              <PhoneFrame><VB.Dashboard pet={pet1} /></PhoneFrame>
            </DCArtboard>
          </DCSection>

          {/* ── STATE 3: 3 PETS GRID ──────────────────── */}
          <DCSection
            id="three"
            title="03 · 3 mascotas — Grilla"
            subtitle="Grilla unificada. Cada mascota mantiene identidad de color y muestra estado + próximo de cada categoría de un vistazo."
          >
            <DCArtboard id="b-three" label="Vet Pro" width={FRAME_W} height={FRAME_H}>
              <PhoneFrame><VB.Grid pets={pets3} /></PhoneFrame>
            </DCArtboard>
          </DCSection>

          {/* ── PET DETAIL ─────────────────────────────── */}
          <DCSection
            id="detail-intro"
            title="Pet Detail"
            subtitle="Detalle de la mascota en Vet Pro. Header grande con monograma, picker de 4 tabs y cada tab con su propio sistema de información."
          >
            <DCPostIt color="#d4e9f7">
              <strong>Sistema heredado</strong><br/>
              · Mismo monograma + paleta por mascota<br/>
              · Inter geométrico + JetBrains Mono en datos<br/>
              · Pills de estado · timelines · KPIs en mono<br/>
              · El color del pet permanece sutil
            </DCPostIt>
            <DCPostIt color="#e8e3d8">
              <strong>Decisiones nuevas</strong><br/>
              · Tab picker como segmented pill negro<br/>
              · Hero oscuro del próximo evento en "Próximos"<br/>
              · Vacunas como series con timeline + progreso<br/>
              · Peso con chart SVG + selector de rango + KPIs
            </DCPostIt>
            <DCPostIt color="#fef4a8">
              <strong>Pendiente discutir</strong><br/>
              · Tab "Parásitos" es análogo a Vacunas → ¿desarrollar igual o unificar?<br/>
              · Acción rápida desde el header<br/>
              · Demo guide (overlays de onboarding)
            </DCPostIt>
          </DCSection>

          <DCSection
            id="detail-upcoming"
            title="Detalle · 01 Próximos"
            subtitle="Tab por defecto. Hero oscuro destacando la próxima acción, secciones por proximidad temporal. Cada fila con icono semántico, dosis, fecha y hora si es inminente."
          >
            <DCArtboard id="detail-upcoming-b" label="Marcos · tab Próximos" width={FRAME_W} height={FRAME_H}>
              <PhoneFrame><PD.Upcoming pet={pet1} /></PhoneFrame>
            </DCArtboard>
          </DCSection>

          <DCSection
            id="detail-vaccines"
            title="Detalle · 02 Vacunas"
            subtitle="Organizadas por serie. Cada card muestra próximo, último, refuerzos y barra de progreso con tick por dosis. La primera serie está expandida; la última muestra estado crítico con dosis vencidas."
          >
            <DCArtboard id="detail-vaccines-b" label="Marcos · tab Vacunas" width={FRAME_W} height={FRAME_H}>
              <PhoneFrame><PD.Vaccines pet={pet1} /></PhoneFrame>
            </DCArtboard>
          </DCSection>

          <DCSection
            id="detail-parasites"
            title="Detalle · 03 Parásitos"
            subtitle="Modelo distinto a Vacunas: protocolos recurrentes (no series finitas). Distinción interno/externo, cadencia prominente, próxima y última, y adherencia con dots de los últimos 6 meses. KPI global arriba."
          >
            <DCArtboard id="detail-parasites-b" label="Marcos · tab Parásitos" width={FRAME_W} height={FRAME_H}>
              <PhoneFrame><PD.Parasites pet={pet1} /></PhoneFrame>
            </DCArtboard>
          </DCSection>

          <DCSection
            id="detail-weight"
            title="Detalle · 04 Peso"
            subtitle="Panel con peso actual + delta, selector de rango (1M/3M/6M/1A/Todo), chart SVG con relleno suave y KPIs (Mín/Prom/Máx). Lista de registros en mono para escaneo rápido."
          >
            <DCArtboard id="detail-weight-b" label="Marcos · tab Peso" width={FRAME_W} height={FRAME_H}>
              <PhoneFrame><PD.Weight pet={pet1} /></PhoneFrame>
            </DCArtboard>
            <DCArtboard id="detail-weight-sheet-b" label="Sheet Registrar peso" width={FRAME_W} height={FRAME_H}>
              <PhoneFrame><PD.WeightSheet pet={pet1} /></PhoneFrame>
            </DCArtboard>
          </DCSection>

          {/* ── STATE 4: 6 PETS + SWIPE ───────────────── */}
          <DCSection
            id="six"
            title="04 · 6 mascotas — Grilla densa + swipe"
            subtitle="La misma grilla escala con la cantidad. La segunda card muestra las acciones rápidas reveladas al deslizar a la izquierda: registrar peso, registrar vacuna."
          >
            <DCArtboard id="b-six" label="Vet Pro · swipe" width={FRAME_W} height={FRAME_H}>
              <PhoneFrame><VB.Grid pets={pets6} showSwipeHint /></PhoneFrame>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    // Wait for all babel scripts to load globals onto window before mounting.
    function mountWhenReady() {
      if (window.VariantB && window.PetDetailB && window.BonesIcons && window.DesignCanvas) {
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
      } else {
        setTimeout(mountWhenReady, 30);
      }
    }
    mountWhenReady();
  </script>
</body>
</html>
